name: StoreSystem_Docker_AuthAPI_GCP

on:
  push:
    branches:
      - features/google-cloud

jobs:
  build:
    uses: ./.github/workflows/docker-reusable-gcp.yml
    with:
      image_name: auth-api
      context: .
      dockerfile: ./AuthAPI/Dockerfile
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}