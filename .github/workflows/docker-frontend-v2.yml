name: StoreSystem_Docker_Frontend_V2
on:
  push:
    branches:
      - features/docker-workflow-v2
jobs:
  build:
    uses: ./.github/workflows/docker-reusable-v2.yml
    with:
      image_name: store-frontend
      context: ./store-frontend
      dockerfile: ./store-frontend/Dockerfile
    secrets:
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}