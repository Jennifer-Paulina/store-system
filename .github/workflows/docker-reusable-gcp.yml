name: Docker_Reusable_GCP

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
    secrets:
      GCP_SA_KEY:
        required: true

env:
  REGISTRY: us-central1-docker.pkg.dev
  PROJECT_ID: store-system-498223
  REPO: store-system

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Revision de código
        uses: actions/checkout@v4

      - name: Autenticar en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar Docker para Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y subir imagen
        uses: docker/build-push-action@v5
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: us-central1-docker.pkg.dev/store-system-498223/store-system/${{ inputs.image_name }}:latest