services:

  # ─── SQL Server ───────────────────────────────────────────────
  sql-server:
    build:
      context: .
      dockerfile: sqlserver.Dockerfile
    container_name: sql-server
    environment:
      SA_PASSWORD: "${SQL_SERVER_PASSWORD}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - sql-server-data:/var/opt/mssql
    networks:
      store-network:
        ipv4_address: 172.20.0.2
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SQL_SERVER_PASSWORD}", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── PostgreSQL Write ─────────────────────────────────────────
  postgres-write:
    image: postgres:16
    container_name: postgres-write
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: storedb
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5432:5432"
    volumes:
      - postgres-write-data:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./init-replicator.sql:/docker-entrypoint-initdb.d/02-replicator.sql
      - ./postgres-primary.conf:/etc/postgresql/postgresql.conf
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    networks:
      store-network:
        ipv4_address: 172.20.0.3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d storedb"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── PostgreSQL Read (Réplica) ────────────────────────────────
  postgres-read:
    image: postgres:16
    container_name: postgres-read
    user: postgres
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: storedb
      PGUSER: "${POSTGRES_USER}"
    ports:
      - "5433:5432"
    volumes:
      - postgres-read-data:/var/lib/postgresql/data
    command: |
      bash -c "
      echo 'postgres-write:5432:replication:replicator:' > /root/.pgpass
      chmod 600 /root/.pgpass
      until pg_basebackup -h postgres-write -D /var/lib/postgresql/data -U replicator -vP -Xs -R --checkpoint=fast; do
        echo 'Esperando al servidor primario...'
        sleep 2
      done
      chmod 700 /var/lib/postgresql/data
      postgres
      "
    depends_on:
      postgres-write:
        condition: service_healthy
    networks:
      store-network:
        ipv4_address: 172.20.0.4

  # ─── AuthAPI ──────────────────────────────────────────────────
  auth-api:
    build:
      context: .
      dockerfile: AuthAPI/Dockerfile
    container_name: auth-api
    environment:
      ConnectionStrings__WriteConnection: "Server=sql-server,1433;Database=AuthDB;User Id=sa;Password=${SQL_SERVER_PASSWORD};TrustServerCertificate=True;"
      ConnectionStrings__ReadConnection: "Server=sql-server,1433;Database=AuthDB;User Id=sa;Password=${SQL_SERVER_PASSWORD};TrustServerCertificate=True;"
      JwtSettings__Secret: "${JWT_SECRET}"
      JwtSettings__Issuer: "AuthAPI"
      JwtSettings__Audience: "StoreSystem"
      JwtSettings__RefreshTokenExpirationDays: "7"
      ASPNETCORE_URLS: "http://+:5163"
    ports:
      - "5163:5163"
    depends_on:
      sql-server:
        condition: service_healthy
    networks:
      store-network:
        ipv4_address: 172.20.0.5

  # ─── StoreAPI ─────────────────────────────────────────────────
  store-api:
    build:
      context: ./store-api
      dockerfile: Dockerfile
    container_name: store-api
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-write:5432/storedb"
      DATABASE_URL_WRITE: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-write:5432/storedb"
      DATABASE_URL_READ: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-read:5432/storedb"
      JWT_SECRET: "${JWT_SECRET}"
      AUTH_API_URL: "http://auth-api:5163"
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres-write:
        condition: service_healthy
      postgres-read:
        condition: service_started
      auth-api:
        condition: service_started
    networks:
      store-network:
        ipv4_address: 172.20.0.6

  # ─── Frontend ─────────────────────────────────────────────────
  store-frontend:
    build:
      context: ./store-frontend
      dockerfile: Dockerfile
    container_name: store-frontend
    ports:
      - "80:80"
    depends_on:
      - auth-api
      - store-api
    networks:
      store-network:
        ipv4_address: 172.20.0.7

# ─── Redes ────────────────────────────────────────────────────
networks:
  store-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ─── Volúmenes ────────────────────────────────────────────────
volumes:
  sql-server-data:
  postgres-write-data:
  postgres-read-data: